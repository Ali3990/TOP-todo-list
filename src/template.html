<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Wall</title>
</head>
<body>
    <h1>Sticky Wall</h1>
    

    <div class="controller">
        <button id="addTaskBtn">Add Task</button>
        <button id="addProjBtn">Add Project</button>
    </div>
     <dialog id="task-dialog">
        <!-- Opens task form -->
    </dialog>


    <div class="content-area">
        <div id="project-list">
            <!-- Renders project list -->
        </div>
        <div id="task-grid">
            <!-- Renders task cards -->
        </div>
    </div>

</body>
</html>
